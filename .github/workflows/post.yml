name: Telegram auto post

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/post.yml"

permissions:
  contents: read

concurrency:
  group: neovo-channel-publishing
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-video-now]') || contains(github.event.head_commit.message, '[publish-now]') || contains(github.event.head_commit.message, '[publish-new]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video tools and Persian fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and publish one regular post
        run: python publish_now.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_BASE_URL: https://api.groq.com/openai/v1
          MODEL_NAME: openai/gpt-oss-20b
          TIMEZONE: Asia/Tehran
          FORCE_VIDEO: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-video-now]') }}
          FORCE_NEW_POST: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-new]') }}

# Manual publish request approved: [publish-now]
